name: lms
description: "A new Flutter project."
publish_to: 'none'
# Tied to /app/version-check on the backend:
#   "1.5.0" → versionName (sent as app_version on login/attendance)
#   50      → versionCode  (sent as app_build,   compared against MIN_BUILD)
# Bump the +<n> on every release. Android refuses installs whose versionCode
# isn't strictly greater than the installed build's.
version: 1.6.0+60

environment:
  # Bumped from ^3.9.2: `tracelet` 3.8.7 requires Dart ^3.10.3. Your installed
  # Flutter (3.38.3) ships a newer Dart than this floor, so this only raises
  # the declared minimum -- it does not require a toolchain change.
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  dio: ^5.4.0
  get_it: ^7.7.0
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  geolocator: ^12.0.0
  uuid: ^4.5.1
  fl_chart: ^0.68.0
  local_auth: ^2.2.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  path: ^1.8.0
  table_calendar: ^3.1.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  camera: ^0.11.0+1
  image: ^4.3.0
  cached_network_image: ^3.3.1
  workmanager: ^0.5.2
  sqflite: ^2.3.3
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.1+2
  open_filex: ^4.5.0
  # Background geolocation engine. Replaces the WorkManager-driven capture
  # loop in core/background/background_tasks.dart -- see
  # core/services/tracelet_service.dart for the integration.
  tracelet: ^3.8.7
  # Pinned EXACTLY. Tracelet 3.8.7's Rust bindings are generated with
  # flutter_rust_bridge 2.12.0 but it only declares `^2.12.0`, so pub resolves
  # 2.13.0 -- and the bridge refuses to start on any version mismatch
  # ("codegen version (2.12.0) should be the same as runtime version
  # (2.13.0)"), which silently disables all location capture. Only move this
  # together with a Tracelet release built against the new version.
  flutter_rust_bridge: 2.12.0
  flutter_pdfview: ^1.4.5
  share_plus: 10.1.4
  flutter_file_dialog: ^3.3.3
  wakelock_plus: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: "^0.13.1"
  bloc_test: ^9.1.6
  mocktail: ^1.0.3
  # In-app diagnostic overlay for Tracelet (permissions/battery/OEM health,
  # pending-location count). Dev-only: kept out of `dependencies` so Flutter
  # excludes it from release builds. Every reference to it in app code is
  # additionally guarded by `kDebugMode` -- see the long-press handler on the
  # Biometric Attendance page.
  #
  # Pinned below 3.3.0: tracelet_doctor >=3.3.0 pulls share_plus -> win32
  # ^6.0.1, which conflicts with device_info_plus ^10.1.0 (already used
  # app-wide for device reporting on login/attendance) requiring win32 <6.0.0.
  # Downgrading this dev-only tool is far lower risk than bumping
  # device_info_plus across the whole app to chase a debug overlay.
  tracelet_doctor: ^3.2.19

flutter:
  uses-material-design: true
    
  assets:
    - lib/assets/images/
    # - assets/images/login-bgg.jpg
    # - assets/images/YDC-HD.png
flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/LMS.png"